<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Didinska Analytics</title>
    
    <!-- Link ke file CSS utama -->
    <link rel="stylesheet" href="assets/style.css">
    
    <!-- AOS CSS untuk efek elemen bermunculan -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
</head>
<body>

    <!-- Hero Section (Bagian Atas) -->
    <div class="glass-card" data-aos="zoom-in" data-aos-duration="1200" style="margin-top: 10vh; text-align: center;">
        <h1 style="font-size: 2.5rem; margin-bottom: 15px;">Dashboard Sistem Analitik</h1>
        <p style="color: #cbd5e1; margin-bottom: 20px;">Pemantauan data real-time yang didukung oleh integrasi AI.</p>
        
        <!-- Animasi AI Core Murni CSS (Pengganti Lottie yang Error) -->
        <div class="ai-core-loader"></div>

        <button class="btn-glow">Mulai Analisis</button>
    </div>

    <!-- Section Fitur (Contoh efek Scroll) -->
    <div class="glass-card" data-aos="fade-up" data-aos-duration="1200" style="margin-top: 20px; margin-bottom: 10vh;">
        <h2>Infrastruktur Sistem</h2>
        <ul style="margin-top: 15px; margin-left: 20px; line-height: 1.8; color: #cbd5e1;">
            <li>Pengolahan Data Kripto & Ekonomi Cepat</li>
            <li>Infrastruktur Serverless Cloudflare Workers</li>
            <li>Sistem Notifikasi Pintar via Telegram</li>
        </ul>
    </div>

    <!-- Inisialisasi Script AOS -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        // Menyalakan trigger animasi ketika di-scroll
        AOS.init();
    </script>

    <!-- Script logika website kamu -->
    <script src="assets/app.js"></script>
</body>
</html>
