<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jadwal News — Didinska</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div id="access-gate" class="access-gate">
  <div class="access-gate-box">
    <div class="access-gate-lock">🔒</div>
    <div class="access-gate-title">DIDINSKA<span class="dot">.</span></div>
    <p>Akses terbatas. Masukkan key untuk melanjutkan.</p>
    <input type="password" id="access-gate-input" class="access-gate-input" placeholder="Access key" autocomplete="off">
    <button id="access-gate-submit" class="btn">Masuk</button>
    <div id="access-gate-error" class="access-gate-error"></div>
  </div>
</div>

<div id="app-content" style="display:none;">

<nav class="nav">
  <div class="nav-brand">DIDINSKA<span class="dot">.</span></div>
  <div class="nav-links">
    <a href="index.html">Beranda</a>
    <a href="jadwal.html" class="active">Jadwal News</a>
    <a href="analisa.html">Analisa News</a>
  </div>
</nav>

<div class="wrap">
  <section class="hero" style="padding-top:24px;">
    <div class="eyebrow"><span class="pulse-dot"></span> Diperbarui berkala</div>
    <h1 style="font-size:32px;">Jadwal <span class="accent">News</span></h1>
    <p>Pantau event yang akan datang.</p>
  </section>

  <div class="section-label">Akan terjadi</div>
  <div id="list-akan" class="loading">Memuat jadwal…</div>

  <footer>
    🏛️ = ekonomi/makro &middot; 🪙 = crypto. Cek ulang ke sumber resmi sebelum ambil keputusan.
  </footer>
</div>

</div>

<script src="data/jadwal.js"></script>
<script src="assets/app.js"></script>
<script src="assets/auth.js"></script>
<script>
function loadAkanTerjadi() {
  const el = document.getElementById("list-akan");
  try {
    const manual = getManualEconomicEvents();
    if (!manual.length) { el.innerHTML = '<div class="empty">Belum ada jadwal event mendatang. Cek lagi nanti.</div>'; return; }
    el.innerHTML = manual.map((it, idx) => eventCardHtml(it, { idx })).join("");
  } catch (e) {
    el.innerHTML = `<div class="empty">Gagal memuat jadwal: ${escapeHtml(e.message)}</div>`;
  }
}

(async () => {
  const authorized = await initAccessGate();
  if (authorized) loadAkanTerjadi();
})();
</script>
</body>
</html>
